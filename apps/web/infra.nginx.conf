# WebSocket/SSE upgrade handling (used by the /meshsat/ proxy below).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ---------------------------------------------------------------------
  # MeshSat same-domain reverse proxy.
  #
  # Proxies https://fleet.dspng.tech/meshsat/ -> https://meshsat.dspng.space/
  # so the MeshSat session cookie becomes a FIRST-PARTY cookie on
  # fleet.dspng.tech. Cross-site iframes never send third-party cookies, which
  # is why a direct iframe to meshsat.dspng.space shows a blank box / login
  # page even when the user is already signed in. Same-domain proxying fixes it.
  # ---------------------------------------------------------------------
  location /meshsat/ {
    # Trailing slash on proxy_pass strips the /meshsat/ prefix before forwarding.
    proxy_pass https://meshsat.dspng.space/;

    # Present the upstream's own hostname + SNI so TLS/vhost resolution works.
    proxy_set_header Host meshsat.dspng.space;
    proxy_ssl_server_name on;
    proxy_ssl_name meshsat.dspng.space;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket / SSE for live node updates.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Rewrite Set-Cookie so the MeshSat session cookie is stored on
    # fleet.dspng.tech and scoped to /meshsat/ (nginx strips the prefix
    # on the way upstream, so the app still sees its original paths).
    proxy_cookie_domain ~.* $host;
    proxy_cookie_path ~.* /meshsat/;

    # Rewrite upstream redirects (absolute or root-relative) back under
    # /meshsat/ so login/redirect flows stay inside the proxy instead of
    # escaping to the FMS app at https://fleet.dspng.tech/login.
    proxy_redirect ~^https?://meshsat\.dspng\.space/(.*)$ /meshsat/$1;
    proxy_redirect ~^/(.*)$ /meshsat/$1;

    # Allow framing from the FMS origin only: drop the upstream framing blocks
    # and re-add a Content-Security-Policy that permits fleet.dspng.tech as a
    # frame-ancestor. (Stock nginx cannot surgically edit one CSP directive,
    # so the upstream CSP is replaced rather than merged.)
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self' https://fleet.dspng.tech https://*.dspng.tech;" always;
  }
}
