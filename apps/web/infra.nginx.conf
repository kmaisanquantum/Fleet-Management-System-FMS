# WebSocket/SSE upgrade handling (used by the /meshsat/ proxy below).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # ---------------------------------------------------------------------
  # MeshSat same-origin reverse proxy.
  #
  # Serves MeshSat under the FMS domain:
  #   https://<fms-host>/meshsat/  ->  https://meshsat.dspng.space/
  # so the browser treats it as FIRST-PARTY on the FMS origin. A direct
  # cross-site iframe cannot carry MeshSat's login state: browsers block
  # third-party cookies (Safari ITP / Firefox TCP / Chrome) and the upstream
  # is additionally gated by an HTTP Basic-auth challenge, so the frame shows
  # a blank box / login prompt even when the user is already signed in.
  # ---------------------------------------------------------------------
  location /meshsat/ {
    # Trailing slash on proxy_pass strips the /meshsat/ prefix before forwarding.
    proxy_pass https://meshsat.dspng.space/;

    # Present the upstream's own hostname + SNI so TLS/vhost resolution works.
    proxy_set_header Host meshsat.dspng.space;
    proxy_ssl_server_name on;
    proxy_ssl_name meshsat.dspng.space;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # NOTE: the client's Authorization header (HTTP Basic) is forwarded to the
    # upstream by default. MeshSat's `WWW-Authenticate: Basic` challenge is
    # relayed to the browser, which then replays the cached credentials for this
    # (FMS) origin on subsequent requests — including inside the iframe.

    # WebSocket / SSE for live node updates.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Rewrite Set-Cookie so any MeshSat cookie is stored on the FMS host and
    # scoped to /meshsat/ (nginx strips the prefix upstream, so the app still
    # sees its original paths). No-op while MeshSat uses Basic auth only.
    proxy_cookie_domain meshsat.dspng.space $host;
    proxy_cookie_path / /meshsat/;

    # Rewrite upstream redirects back under /meshsat/ (both root-relative and
    # absolute) so login/redirect flows stay inside the proxy instead of
    # escaping to the FMS app root.
    proxy_redirect / /meshsat/;
    proxy_redirect https://meshsat.dspng.space/ /meshsat/;

    # Allow framing from the FMS origin only: drop the upstream framing blocks
    # and re-add a CSP that permits same-origin framing ('self' = the FMS host).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # If MeshSat's frontend emits absolute asset/API paths (e.g. /assets/...) or
    # absolute origin URLs in its HTML, uncomment and adapt these to rewrite the
    # proxied response. Requires the ngx_http_sub_module (present in the official
    # nginx image). Verify the real asset paths first — they sit behind the auth
    # wall and could not be inspected during setup.
    # sub_filter_types text/html text/css application/javascript;
    # sub_filter_once off;
    # sub_filter '"/assets/' '"/meshsat/assets/';
    # sub_filter "'/assets/" "'/meshsat/assets/";
    # sub_filter 'https://meshsat.dspng.space/' '/meshsat/';
    # proxy_set_header Accept-Encoding "";
  }
}
