server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # MeshSat gateway webhook ingress (stable HTTPS target for the MeshSat gateway).
  # Exposes the telemetry relay so the gateway can POST to
  # https://fleet.dspng.tech/meshsat-relay/webhook
  location /meshsat-relay/ {
    proxy_pass http://meshsat-relay:6055/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
