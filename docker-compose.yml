services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nac-fms-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      TELEMETRY_API_KEY: ${TELEMETRY_API_KEY:-dev-telemetry-key-12345}
      DB_PATH: /app/data/fms.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      MAX_ALLOWED_VARIANCE_PCT: ${MAX_ALLOWED_VARIANCE_PCT:-0.5}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  meshsat-relay:
    build:
      context: ./services/meshsat-relay
      dockerfile: Dockerfile
    container_name: nac-meshsat-relay
    restart: unless-stopped
    ports:
      - "6055:6055"
    environment:
      PORT: 6055
      FMS_URL: http://api:4000
      FMS_API_KEY: ${TELEMETRY_API_KEY:-dev-telemetry-key-12345}
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nac-fms-web
    restart: unless-stopped
    ports:
      - "80"
    depends_on:
      - api

volumes:
  api-data:
