services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nac-fms-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
      DB_PATH: /app/data/fms.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      MAX_ALLOWED_VARIANCE_PCT: ${MAX_ALLOWED_VARIANCE_PCT:-0.5}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nac-fms-web
    restart: unless-stopped
    ports:
      - "80"
    depends_on:
      - api

  teltonika-relay:
    build:
      context: ./services/teltonika-relay
      dockerfile: Dockerfile
    container_name: nac-fms-teltonika-relay
    restart: unless-stopped
    ports:
      - "6056:6056"   # Teltonika AVL TCP protocol (point FMB125 server host/port here)
      - "6057:6057"   # HTTP health endpoint
    environment:
      PORT: 6056
      HEALTH_PORT: 6057
      FMS_URL: ${FMS_URL:-https://fleet.dspng.tech}
      # Must match TELEMETRY_API_KEY in apps/api/.env (shared with meshsat-relay)
      FMS_API_KEY: ${TELEMETRY_API_KEY:-dev-telemetry-key-12345}
    depends_on:
      - api

volumes:
  api-data:
